name: Noxentra Security Scan

on:
  pull_request:
  workflow_dispatch:
    inputs:
      targets:
        description: "Authorized target URL/domain/repo path"
        required: true
      pipeline:
        description: "Noxentra pipeline name"
        default: "sast_scan"

jobs:
  noxentra-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Noxentra
        run: uv sync --frozen
      - name: Run Noxentra Headless Assessment
        run: |
          uv run noxentra \
            --engagement ci-scan \
            --targets "${{ inputs.targets || '.' }}" \
            --pipeline "${{ inputs.pipeline || 'sast_scan' }}" \
            --profile defensive_forensic \
            --fail-on-critical 0 \
            --report --format sarif
          if [ -f "$HOME/.noxentra/engagements/ci-scan/report.sarif.json" ]; then
            cp "$HOME/.noxentra/engagements/ci-scan/report.sarif.json" report.sarif.json
          fi
      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('report.sarif.json') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: report.sarif.json
