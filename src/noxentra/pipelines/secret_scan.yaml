# pipelines/secret_scan.yaml
name: secret_scan
description: Git & filesystem secret scan (gitleaks).
steps:
  - tool: gitleaks
    args: ["detect", "--no-git", "--report-format", "json", "--report-path", "-"]
    input: targets
    per_target_flag: "--source"
    workers: 2
    output: raw/gitleaks.json
    parser: gitleaks
