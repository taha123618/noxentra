# SQL Injection — guided-ops cheatsheets for the existing Python "SQL Injection
# Tools" collection, plus the modern sqlmap alternative and high-value references.
# Overlays enrich existing tools by EXACT title; archived tools are left minimal.
category:
  title: "SQL Injection (catalog)"
  merge_into: "SQL Injection Tools"

overlay: []

# --- migrated from tools/sql_injection.py + Ghauri --------------------------
tools:
  - title: "Sqlmap tool"
    kind: install
    tags: [web, sql-injection, exploitation, scanner]
    description: "sqlmap is an open source penetration testing tool that automates detecting and exploiting SQL injection flaws."
    system_pkgs: {which: sqlmap, apt: sqlmap}
    install:
      commands:
        - "git clone --depth 1 https://github.com/sqlmapproject/sqlmap.git sqlmap-dev"
    run: ["cd sqlmap-dev;python3 sqlmap.py --wizard"]
    project_url: "https://github.com/sqlmapproject/sqlmap"
    usage:
      - ["test a URL (auto-answer prompts)", "sqlmap -u 'http://target/page?id=1' --batch"]
      - ["banner + current user/db", "sqlmap -u 'http://target/?id=1' --batch --banner --current-user --current-db"]
      - ["enumerate databases", "sqlmap -u 'http://target/?id=1' --batch --dbs"]
      - ["dump a table", "sqlmap -u 'http://target/?id=1' -D shop -T users --dump --batch"]
      - ["test a saved Burp request", "sqlmap -r request.txt --batch"]
      - ["POST body, target one param", "sqlmap -u 'http://target/login' --data='user=a&pass=b' -p user --batch"]
      - ["go deeper (more tests)", "sqlmap -u 'http://target/?id=1' --level=5 --risk=3 --batch"]
    lab_safe_notes: >-
      sqlmap performs real injection and can modify/dump data — always scope -u/-r to
      an authorized target and prefer --batch for repeatable runs. --level/--risk make
      it far more intrusive (and slower); raise them only on lab boxes. --os-shell and
      --dump touch the live DB, so confirm you have permission first.

  - title: "NoSqlMap"
    kind: install
    tags: [web, sql-injection, exploitation]
    description: "NoSQLMap is an open source Python tool designed to audit and automate injection attacks."
    install:
      commands:
        - "git clone https://github.com/codingo/NoSQLMap.git"
        - "cd NoSQLMap && pip install --user ."
    run: ["python3 -m nosqlmap"]
    project_url: "https://github.com/codingo/NoSQLMap"
    usage:
      - ["launch the interactive tool", "python3 -m nosqlmap"]
    lab_safe_notes: >-
      NoSQLMap is menu-driven — it walks you through target/attack selection. It audits
      MongoDB (and similar) injection and can enumerate/extract data, so run it only
      against authorized instances. Needs a reachable MongoDB to be useful.

  - title: "Damn Small SQLi Scanner"
    kind: install
    tags: [web, sql-injection, scanner]
    description: "DSSS is a fully functional SQL injection vulnerability scanner also supporting GET and POST parameters."
    install: {git: "https://github.com/stamparm/DSSS.git"}
    project_url: "https://github.com/stamparm/DSSS"
    usage:
      - ["scan a URL for SQLi", "python3 dsss.py -u 'http://target/vuln.php?id=1'"]
      - ["pass a session cookie", "python3 dsss.py -u 'http://target/vuln.php?id=1' -c 'PHPSESSID=abc'"]
      - ["see all options", "python3 dsss.py -h"]
    lab_safe_notes: >-
      DSSS is a lightweight detector (a single ~100-line script) — it flags likely
      injection points but doesn't exploit them, so it's a gentle first pass. Confirm
      any hit with sqlmap. Scope -u to an authorized URL.

  - title: "Explo"
    kind: install
    archived: true
    archived_reason: "Upstream repo archived by author (last commit 2022-09)"
    tags: [web, vuln-scan, scanner]
    description: "Explo is a simple tool to describe web security issues in human and machine readable format."
    install:
      commands:
        - "git clone https://github.com/dtag-dev-sec/explo.git"
        - "cd explo && pip install --user ."
    project_url: "https://github.com/dtag-dev-sec/explo"
    usage:
      - ["run a testcase (archived)", "explo --verbose testcase.yaml"]

  - title: "Blisqy - Exploit Time-based blind-SQL injection"
    kind: install
    archived: true
    archived_reason: "Unmaintained — no commits since 2019-03"
    tags: [web, sql-injection, exploitation]
    description: "Blisqy helps web security researchers find time-based blind SQL injections on HTTP headers and exploit them."
    install: {git: "https://github.com/JohnTroony/Blisqy.git"}
    project_url: "https://github.com/JohnTroony/Blisqy"
    usage:
      - ["show Blisqy help (archived)", "python3 blisqy.py --help"]

  - title: "Leviathan - Wide Range Mass Audit Toolkit"
    kind: install
    archived: true
    archived_reason: "Upstream repo archived by author (last commit 2018-10)"
    tags: [web, sql-injection, scanner, bruteforce]
    description: "Leviathan is a mass audit toolkit with service discovery, brute force, SQL injection detection, and custom exploit capabilities."
    install:
      commands:
        - "git clone https://github.com/leviathan-framework/leviathan.git"
        - "cd leviathan;pip install --user -r requirements.txt"
    run: ["cd leviathan;python leviathan.py"]
    project_url: "https://github.com/leviathan-framework/leviathan"
    usage:
      - ["launch Leviathan (archived)", "python leviathan.py"]

  - title: "SQLScan"
    kind: install
    tags: [web, sql-injection, scanner]
    description: "SQLScan is a quick web scanner to find SQL injection points. Not for educational purposes."
    install:
      commands:
        - "sudo apt install php php-bz2 php-curl php-mbstring curl"
        - "sudo curl https://raw.githubusercontent.com/Cvar1984/sqlscan/dev/build/main.phar --output /usr/local/bin/sqlscan"
        - "chmod +x /usr/local/bin/sqlscan"
    run: ["sudo sqlscan"]
    project_url: "https://github.com/Cvar1984/sqlscan"
    usage:
      - ["launch the interactive scanner", "sudo sqlscan"]
    lab_safe_notes: >-
      A quick crawler that hunts for injectable parameters across a site. It's a
      discovery aid — verify findings with a real exploitation tool. Only point it at
      domains you are authorized to test.
  - title: "Ghauri (Modern SQLi Tool)"
    kind: install
    tags: [web, sql-injection, exploitation, scanner]
    description: "Fast, sqlmap-compatible SQL injection detection and exploitation tool that handles cases sqlmap misses (WAF/complex flows)."
    system_pkgs: {which: ghauri, pip: ghauri}
    install: {pip: ghauri}
    run: ["ghauri --help"]
    project_url: "https://github.com/r0oth3x49/ghauri"
    usage:
      - ["test a URL", "ghauri -u 'http://target/?id=1' --batch"]
      - ["from a Burp request file", "ghauri -r request.txt --batch"]
      - ["current db + user", "ghauri -u 'http://target/?id=1' --current-db --current-user --batch"]
      - ["enumerate databases", "ghauri -u 'http://target/?id=1' --dbs --batch"]
      - ["dump a table", "ghauri -u 'http://target/?id=1' -D shop -T users --dump --batch"]
    lab_safe_notes: >-
      Ghauri mirrors sqlmap's flags and likewise performs real injection — scope -u/-r
      to an authorized target and use --batch for unattended runs. Reach for it when
      sqlmap stalls on a target it can't confirm.

