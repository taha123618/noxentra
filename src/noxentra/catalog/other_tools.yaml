# Other Tools — grab-bag menu. Almost every entry in the Python "Other tools"
# collection is itself a sub-menu (social-media bruteforce, android attack, hash
# cracking, wifi jamming, payload injection, web crawling, homograph, email
# verify, mix tools ...) with no single canonical command — those are curated in
# their own catalogs, so they're skipped here. HatCloud is the one real leaf CLI.
category:
  title: "Other Tools (catalog)"
  merge_into: "Other tools"

# --- enrich existing Python-defined tools by title --------------------------
overlay:
  - title: "HatCloud(Bypass CloudFlare for IP)"
    tags: [recon, network, dns]
    usage:
      - [
          "find the origin IP behind CloudFlare for a domain",
          "ruby hatcloud.rb -b example.com",
        ]
    lab_safe_notes: >-
      HatCloud queries public/CrimeFlare data to guess the real origin IP hidden
      behind CloudFlare — it does not attack the target. Only run it against
      domains you're authorized to test; use the result to confirm scope, not to
      route around a WAF on an out-of-scope host.

# --- grab-bag reference every archetype reaches for --------------------------
tools:
  - title: "tshark (CLI Packet Analyzer)"
    kind: install
    tags: [network, sniffing, pcap, forensics]
    description: "Terminal-based Wireshark packet capture and protocol dissector — filter pcaps or live interfaces with display filters and JSON/fields output."
    system_pkgs: { which: tshark, apt: tshark, brew: wireshark }
    install: { apt: tshark }
    run: ["tshark --version"]
    project_url: "https://www.wireshark.org/docs/man-pages/tshark.html"
    usage:
      - [
          "inspect HTTP requests in a pcap",
          "tshark -r capture.pcap -Y http.request -T fields -e http.host -e http.request.uri",
        ]
      - [
          "capture 100 packets on an interface",
          "tshark -i eth0 -c 100 -w out.pcap",
        ]
    lab_safe_notes: >-
      Offline pcap reading (`-r`) is passive and safe. Live interface capture should
      only run on networks you own or are authorized to monitor.

  - title: "CyberChef (Cyber Swiss-Army Knife)"
    kind: resource
    tags: [reference, online-service]
    description: "GCHQ's browser-based workbench for encoding/decoding, encryption, compression, hashing and data analysis — chain 'recipes' to decode CTF/forensics artifacts with no install."
    url: "https://gchq.github.io/CyberChef/"
  - title: D4 (Deep Web Reconnaissance Directory)
    kind: install
    tags:
      - recon
      - enumeration
      - web
    description:
      Curated list of deep/dark web resources, hidden wikis, marketplaces,
      and research sites for OSINT and adversarial intelligence.
    supported_os:
      - linux
      - macos
    system_pkgs:
      which: d4
    install:
      pip: d4
    run:
      - d4 --help
    project_url: https://github.com/sijad/d4
    usage:
      - - open the interactive D4 menu
        - d4
    lab_safe_notes:
      "Reference directory of onion/deep web sites — use only against
      authorized research targets or for educational OSINT exercises."
  - title: Crefile (OSINT Credential Hunting)
    kind: install
    tags:
      - osint
      - recon
      - credentials
    description:
      Collects paste site credentials (Pastebin, Ghostbin, ZeroBin, etc.)
      using Pastebin API and paste sites scraping.
    supported_os:
      - linux
      - macos
    system_pkgs:
      which: cref
    install:
      pip: cref
    run:
      - cref --help
    project_url: https://github.com/kathanP19/Crefile
    usage:
      - - search multiple paste sites for keywords
        - cref <keyword>
    lab_safe_notes:
      Passive paste scraping — use strict scope limits; unauthorized
      scraping may violate terms of service.
  - title: ScrapedBeast (OSINT Scraping Framework)
    kind: install
    tags:
      - osint
      - recon
      - crawler
    description: Automated scraping framework for intelligence gathering across
      social media, forums, and deep web directories.
    supported_os:
      - linux
      - macos
    system_pkgs:
      which: sb
    install:
      pip: scrapedbeast
    run:
      - sb --help
    project_url: https://github.com/skulldivine/ScrapedBeast
    usage:
      - - run automated reconnaissance
        - sb -t example.com
    lab_safe_notes:
      Automated scraping — only run against targets you own or have
      explicit permission to analyze.
  - title: C3 (Cyber Connect Consciousness) AI Recon
    kind: install
    tags:
      - osint
      - recon
      - scanner
    description:
      AI-driven reconnaissance platform combining social media intelligence,
      credential hunting, and dark web scraping with automated reporting.
    supported_os:
      - linux
      - macos
    system_pkgs:
      which: c3
    install:
      pip: c3
    run:
      - c3 --help
    project_url: https://github.com/KathanP19/C3
    usage:
      - - start C3 interactive assistant
        - c3
    lab_safe_notes:
      "AI-assisted recon — ensure all data sources are within authorized
      scope and respect privacy regulations."
