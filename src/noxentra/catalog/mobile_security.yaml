# Mobile Security — guided-ops cheatsheets for the existing Python "Mobile
# Security Tools" collection (MobSF / Frida / Objection), plus adb as the
# missing Android staple and two high-value references. Overlays enrich existing
# tools by EXACT title (no Python edits). apktool/JadX are intentionally NOT here
# — they already live in reverse_engineering.yaml (don't duplicate titles).
category:
  title: "Mobile Security (catalog)"
  merge_into: "Mobile Security Tools"

overlay: []

# --- migrated from tools/mobile_security.py + missing Android staple --------
tools:
  - title: "MobSF (Mobile Security Framework)"
    kind: install
    tags: [mobile, apk, vuln-scan, scanner, malware-analysis]
    description: "All-in-one mobile app pentesting, malware analysis, and security assessment."
    supported_os: [linux, macos]
    install:
      commands:
        - "git clone https://github.com/MobSF/Mobile-Security-Framework-MobSF.git"
        - "cd Mobile-Security-Framework-MobSF && ./setup.sh"
    run: ["cd Mobile-Security-Framework-MobSF && ./run.sh"]
    project_url: "https://github.com/MobSF/Mobile-Security-Framework-MobSF"
    usage:
      - ["start the web UI (from the cloned repo)", "./run.sh 127.0.0.1:8000"]
      - ["run the whole stack via Docker", "docker run -it --rm -p 8000:8000 opensecurity/mobile-security-framework-mobsf:latest"]
    lab_safe_notes: >-
      MobSF is a web app — start it, open http://127.0.0.1:8000, then upload the
      APK/IPA to analyze. Static analysis is fully offline and safe; the dynamic
      analyzer drives a real/emulated device, so only test apps you own or are
      authorized to assess.

  - title: "Frida (Dynamic Instrumentation)"
    kind: install
    tags: [mobile, reversing, malware-analysis]
    description: "Dynamic instrumentation toolkit for runtime hooking on Android, iOS, Windows, macOS, Linux."
    supported_os: [linux, macos]
    system_pkgs: {which: frida, pip: frida-tools}
    install: {pip: frida-tools}
    run: ["frida --help"]
    project_url: "https://github.com/frida/frida"
    usage:
      - ["list running apps on the USB device", "frida-ps -U"]
      - ["list installed apps", "frida-ps -U -a -i"]
      - ["spawn an app and load a hook script", "frida -U -f com.example.app -l hook.js"]
      - ["attach to a running app by name", "frida -U -n AppName"]
    lab_safe_notes: >-
      Frida instruments a live process, so it needs a rooted/jailbroken test
      device or emulator with a matching frida-server running (-U talks to it over
      USB). Only hook apps you own or are explicitly authorized to test.

  - title: "Objection (Mobile Runtime Exploration)"
    kind: install
    tags: [mobile, reversing]
    description: "Runtime mobile exploration toolkit powered by Frida — no jailbreak/root required."
    supported_os: [linux, macos]
    system_pkgs: {which: objection, pip: objection}
    install: {pip: objection}
    run: ["objection --help"]
    project_url: "https://github.com/sensepost/objection"
    usage:
      - ["explore a running app (interactive REPL)", "objection -g com.example.app explore"]
      - ["explore with SSL pinning disabled at start", "objection -g com.example.app explore --startup-command 'android sslpinning disable'"]
      - ["patch an APK with the Frida gadget (no root)", "objection patchapk -s app.apk"]
    lab_safe_notes: >-
      Objection is powered by Frida — the `explore` flow needs frida-server on a
      rooted/jailbroken device or emulator; `patchapk` embeds the gadget so a
      non-rooted device works instead. Runtime changes (pinning/root bypass) are
      per-session and non-persistent. Authorized apps only.
  - title: "adb (Android Debug Bridge)"
    kind: install
    tags: [mobile, apk]
    description: "Android Debug Bridge — the core CLI for talking to Android devices/emulators: install/pull APKs, shell, and read logs."
    system_pkgs: {which: adb, apt: adb, brew: android-platform-tools}
    install: {apt: adb}
    run: ["adb version"]
    project_url: "https://developer.android.com/tools/adb"
    usage:
      - ["list connected devices/emulators", "adb devices"]
      - ["install an APK", "adb install app.apk"]
      - ["pull an installed app's APK off the device", "adb shell pm path com.example.app"]
      - ["open a device shell", "adb shell"]
      - ["stream device logs", "adb logcat"]
      - ["list installed packages", "adb shell pm list packages"]
    lab_safe_notes: >-
      adb needs USB debugging enabled on the device; use it only on test
      devices/emulators and apps you own or are authorized to assess. `adb shell`
      runs as the shell user (not root) unless the device is rooted — no blanket
      privilege is required for install/pull/logcat.

  - title: "apkleaks (APK URI & Secret Scanner)"
    kind: install
    tags: [mobile, apk, scanner, credentials]
    description: "Scans Android APK files for hardcoded URIs, endpoints, API keys, and secrets using jadx decompilation."
    system_pkgs: {which: apkleaks}
    install: {pip: apkleaks}
    run: ["apkleaks --help"]
    project_url: "https://github.com/dwisiswant0/apkleaks"
    usage:
      - ["scan an APK for endpoints and secrets", "apkleaks -f app.apk"]
      - ["save results as JSON", "apkleaks -f app.apk -o results.json --json"]
    lab_safe_notes: >-
      Completely static and offline analysis of the APK file — sends zero network
      requests to any backend.

  - title: "mobsfscan (Mobile Static Code Analyzer)"
    kind: install
    tags: [mobile, scanner, vuln-scan]
    description: "Static analysis scanner for Android (Java/Kotlin) and iOS (Swift/Objective-C) source code based on MobSF rules."
    system_pkgs: {which: mobsfscan}
    install: {pip: mobsfscan}
    run: ["mobsfscan --help"]
    project_url: "https://github.com/MobSF/mobsfscan"
    usage:
      - ["scan a mobile source directory", "mobsfscan ./app-src/"]
      - ["emit SARIF output for CI", "mobsfscan --sarif -o results.sarif ./app-src/"]
    lab_safe_notes: >-
      Reads mobile source code statically and offline — safe for CI/CD and local audits.

  - title: "reFlutter (Flutter RE & SSL Bypass)"
    kind: install
    tags: [mobile, reversing, apk]
    description: "Reverse-engineering helper for Flutter Android/iOS apps that patches snapshot binaries to enable traffic interception and function dumping."
    system_pkgs: {which: reflutter}
    install: {pip: reflutter}
    run: ["reflutter --help"]
    project_url: "https://github.com/ptswarm/reFlutter"
    usage:
      - ["patch a Flutter APK for Burp/mitmproxy traffic interception", "reflutter app.apk"]
    lab_safe_notes: >-
      Produces a patched APK locally for dynamic analysis in your own emulator/test
      device — use only on apps you are authorized to test.

  - title: "quark-engine (Android Malware Scoring)"
    kind: install
    tags: [mobile, apk, malware-analysis, scanner]
    description: "Dalvik bytecode analysis engine that detects Android malware behaviors and scores suspicious API call sequences."
    system_pkgs: {which: quark}
    install: {pipx: quark-engine}
    run: ["quark --help"]
    project_url: "https://github.com/quark-engine/quark-engine"
    usage:
      - ["analyze an APK with Quark rules", "quark -a app.apk -s"]
    lab_safe_notes: >-
      Static Dalvik bytecode analysis — never executes the inspected APK.

  - title: "Androguard (Android APK/DEX Analyzer)"
    kind: install
    tags: [mobile, apk, reversing, binary]
    description: "Python reverse-engineering and static analysis suite for Android APKs, DEX bytecode, AXML manifests, and resources."
    system_pkgs: {which: androguard}
    install: {pipx: androguard}
    run: ["androguard --help"]
    project_url: "https://github.com/androguard/androguard"
    usage:
      - ["inspect AndroidManifest.xml from an APK", "androguard axml app.apk"]
      - ["open an APK in interactive analysis shell", "androguard analyze app.apk"]
    lab_safe_notes: >-
      Purely static binary/manifest analysis — safe for offline APK triage.

# --- high-value mobile-security references -----------------------------------
  - title: "OWASP MAS (Mobile App Security)"
    kind: resource
    tags: [mobile, reference, learning]
    description: "OWASP Mobile Application Security project — the MASVS standard and the MASTG testing guide with concrete Android/iOS test cases."
    url: "https://mas.owasp.org/"

  - title: "Frida CodeShare"
    kind: resource
    tags: [mobile, reversing, online-service, reference]
    description: "Community repository of ready-to-run Frida scripts (SSL-pinning bypasses, root-detection bypasses, tracing) — load with `frida --codeshare`."
    url: "https://codeshare.frida.re/"
