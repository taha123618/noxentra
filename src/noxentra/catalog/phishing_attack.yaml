  run:
  - sudo setoolkit
  project_url: https://github.com/trustedsec/social-engineer-toolkit
  usage:
  - - launch the framework (menu-driven)
    - sudo setoolkit
  - - 'typical path: Social-Engineering Attacks'
    - menu 1
  - - clone a site to harvest creds
    - menu 1 > 2 (Website Attack) > 3 (Credential Harvester) > 2 (Site Cloner)
  lab_safe_notes: SET is an interactive menu framework, not a flag-driven CLI — you
    navigate numbered menus (the paths above are the numbers you type, not shell arguments).
    The credential harvester and site cloner capture real passwords; only ever point
    them at your own test accounts / domains or an engagement with signed authorization
    and defined scope.
