- title: GoPhish (Phishing Simulation)
  kind: install
  tags:
  - phishing
  - social-engineering
  - email
  - credentials
  - web
  description: 'The standard open-source phishing-simulation platform for authorized
    awareness campaigns: web admin UI + REST API to build email templates, landing
    pages, sending profiles and track opens/clicks/submits.'
  system_pkgs:
    which: gophish
  run:
  - gophish
  project_url: https://getgophish.com/
  usage:
  - - start the server (reads config.json)
    - ./gophish
  - - then open the admin UI (creds printed on first run)
    - https://127.0.0.1:3333
  - - phishing pages/tracking are served on
    - http://0.0.0.0:80
  lab_safe_notes: GoPhish is configured through its web admin UI and REST API, not
    shell flags — download the pinned release binary from the GitHub releases page
    (verify the checksum), do NOT pipe an installer to a shell. Built for organizations
    to phish THEIR OWN staff with management sign-off; every campaign needs explicit
    written authorization, defined scope, and target consent per your org's policy.
    Change the default admin password immediately.
