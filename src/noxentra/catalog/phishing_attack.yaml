- title: dnstwist
  kind: install
  tags:
  - osint
  - dns
  - phishing
  description: Domain name permutation engine for detecting typosquatting, phishing
    and brand impersonation
  supported_os:
  - linux
  - macos
  system_pkgs:
    which: dnstwist
  install:
    commands:
    - pip3 install --user dnstwist
  run:
  - dnstwist --help
  project_url: https://github.com/elceef/dnstwist
  usage:
  - - generate + resolve look-alike domains
    - dnstwist example.com
  - - only show already-registered permutations
    - dnstwist --registered example.com
  - - JSON output for pipelines
    - dnstwist --format json example.com
  - - add whois lookups on registered hits
    - dnstwist --registered --whois example.com
  - - flag domains with MX (can receive phishing mail)
    - dnstwist --mxcheck example.com
  - - fuzzy-compare pages to spot cloned sites
    - dnstwist --ssdeep example.com
  lab_safe_notes: dnstwist is a DEFENSIVE / OSINT tool — it enumerates typosquat and
    look-alike domains of a name you give it and checks which are registered. Passive
    (DNS/whois lookups); safe to run against your own brand to find impersonation.
    Use --format json to feed the pipeline.
- title: Evilginx3
  kind: install
  tags:
  - phishing
  - mitm
  - credentials
  - web
  description: 'evilginx is a man-in-the-middle attack framework used for phishing
    login credentials

    along with session cookies, bypassing 2-factor authentication.

    Requires Go >= 1.18 installed.'
  supported_os:
  - linux
  system_pkgs:
    which: evilginx
  install:
    commands:
    - sudo apt-get install -y git make golang-go
    - go install github.com/kgretzky/evilginx/v3@latest
  run:
  - evilginx
  project_url: https://github.com/kgretzky/evilginx2
  usage:
  - - start the interactive console
    - evilginx
  - - '[in console] set the base domain'
    - config domain example.com
  - - '[in console] set the external IP'
    - config ipv4 external <your-ip>
  - - '[in console] load a phishlet on a hostname'
    - phishlets hostname <phishlet> login.example.com
  - - '[in console] enable a phishlet'
    - phishlets enable <phishlet>
  - - '[in console] create a lure for a phishlet'
    - lures create <phishlet>
  - - '[in console] get the phishing URL for a lure'
    - lures get-url <id>
  lab_safe_notes: evilginx runs as an interactive console — the lines above are commands
    typed AT its prompt, not shell arguments. It is a reverse-proxy MITM that captures
    live credentials AND session cookies to bypass 2FA, so it is extremely powerful
    and dangerous. Use only with explicit written authorization, on domains you control,
    against consenting test accounts — never real users or third-party services.
