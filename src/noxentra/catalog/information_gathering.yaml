- title: Maigret (Username OSINT)
  kind: install
  tags:
  - osint
  - recon
  - lookup
  description: 'Collect a dossier on a person by username across 3000+ sites.

    Usage: maigret <username>'
  supported_os:
  - linux
  - macos
