- title: Masscan (Fast Port Scanner)
  kind: install
  tags:
  - port-scan
  - scanner
  - network
  description: 'Fastest internet port scanner — 10 million packets/sec.

    Usage: masscan -p1-65535 <IP> --rate=1000'
  supported_os:
  - linux
  install:
    commands:
    - sudo apt-get install -y masscan
  run:
  - masscan --help
  project_url: https://github.com/robertdavidgraham/masscan
  usage:
  - - scan all ports on a range
    - sudo masscan <ip-range> -p1-65535 --rate 1000
  - - scan common web ports
    - sudo masscan <ip-range> -p80,443 --rate 10000
- title: Network Map (nmap)
  kind: install
  tags:
  - scanner
  - port-scan
  - recon
  - network
  description: Free and open source utility for network discovery and security auditing
  supported_os:
  - linux
  - macos
  system_pkgs:
    which: nmap
    apt: nmap
    brew: nmap
  install:
    commands:
    - git clone https://github.com/nmap/nmap.git
    - sudo chmod -R 755 nmap && cd nmap && sudo ./configure && make && sudo make install
  project_url: https://github.com/nmap/nmap
  usage:
  - - ping-sweep a subnet (who's alive)
    - nmap -sn 10.10.10.0/24
  - - quick scan of common ports
    - nmap -F <target>
  - - service + version detection
    - nmap -sV -Pn <target>
  - - full TCP port scan
    - nmap -p- <target>
  - - safe default scripts + versions
    - nmap -sC -sV -Pn <target>
  - - output all formats for later
    - nmap -sV -oA scan <target>
  lab_safe_notes: To go easy on a lab box, prefer -T2 and scope to the single target;
    avoid -T5 subnet sweeps. -Pn skips host discovery (useful when ICMP is blocked).
    nmap only touches the hosts you name — never a broadcast.
