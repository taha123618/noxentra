category:
  title: Information gathering (catalog)
  merge_into: Information gathering tools
overlay: []
tools:
- title: Amass (Attack Surface Mapping)
  kind: install
  tags:
  - subdomain-enum
  - recon
  - osint
  - dns
  description: 'In-depth subdomain enumeration and attack surface mapping.

    Usage: amass enum -d example.com'
  supported_os:
  - linux
  install:
    commands:
    - go install -v github.com/owasp-amass/amass/v4/...@master
  run:
  - amass -h
  project_url: https://github.com/owasp-amass/amass
  usage:
  - - active + passive enumeration
    - amass enum -d <domain>
  - - passive-only enumeration
    - amass enum -passive -d <domain>
  - - intel gathering by domain
    - amass intel -d <domain>
- title: Dracnmap
  kind: install
  tags:
  - port-scan
  - scanner
  - network
  - recon
  description: "Dracnmap is an open source program which is using to \nexploit the\
    \ network and gathering information with nmap help."
  archived: true
  archived_reason: Unmaintained — no commits since 2018-01
  supported_os:
  - linux
  - macos
  install:
    commands:
    - git clone https://github.com/Screetsec/Dracnmap.git
    - cd Dracnmap && chmod +x dracnmap-v2.2-dracOs.sh  dracnmap-v2.2.sh
  run:
  - cd Dracnmap;sudo ./dracnmap-v2.2.sh
  project_url: https://github.com/Screetsec/Dracnmap
  usage:
  - - run Dracnmap
    - cd Dracnmap;sudo ./dracnmap-v2.2.sh
- title: Gitleaks (Git Secret Scanner)
