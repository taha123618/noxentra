<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tool Catalog — Noxentra</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <meta name="description" content="Search and filter all 309 curated security and reconnaissance tools across 22 categories in Noxentra." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style/catalog.css" />
  <link rel="stylesheet" href="style/layout.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="hero-compact">
      <h1>Tool Catalog</h1>
      <p class="sub">Search and filter all 309 active tools across 22 categories. Click any tag to filter.</p>
      <div class="controls">
        <input class="search-input" id="q" type="search" placeholder="Search tools, descriptions, or tags (e.g. kubernetes, nuclei, adcs)..." aria-label="Search tools" />
        <select class="cat-select" id="cat" aria-label="Filter by category">
          <option value="">All 22 categories</option>
        </select>
        <span class="count-badge" id="count">309 tools</span>
      </div>
      <div class="cat-pills" id="cat-pills" role="group" aria-label="Filter by category"></div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
  <footer id="site-footer"></footer>

  <script src="js/catalog.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
